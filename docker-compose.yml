# MiniScira — self-hosted deployment (zero SaaS)
#
#   cp .env.example .env        # fill in the REQUIRED values
#   docker compose build
#   docker compose up -d db
#   docker compose --profile migrate run --rm migrate
#   docker compose up -d app
#
# Everything is driven by environment variables — nothing is hardcoded in the
# image. The bundled `db` service is Postgres + pgvector (the schema requires
# the vector extension). All AI calls go to whatever OpenAI-compatible
# endpoint AI_GATEWAY_BASE_URL points at.
#
# POSTGRES_PASSWORD is read from COMPOSE'S interpolation environment (the
# root .env, shell variables, or `--env-file`) — NOT from the app's
# `env_file` — so it must be present in .env alongside the other values.
# Keep it consistent with the password embedded in DATABASE_URL.
#
# External / managed Postgres? Use the provided override instead of editing
# this file (needs Compose v2.20+):
#   docker compose -f docker-compose.yml -f docker-compose.external-db.yml up -d --build
name: miniscira

services:
  docker-socket-proxy:
    # Private default-deny middleware for Portainer's own Docker Engine. It
    # mounts Portainer's real socket directly, so Docker exec streams remain
    # standard and MiniScira needs no Portainer credential.
    image: miniscira-docker-api-proxy:local
    restart: unless-stopped
    environment:
      DOCKER_SOCKET: /var/run/docker.sock
      SANDBOX_DOCKER_NETWORK: miniscira_sandbox-egress
      SANDBOX_DOCKER_IMAGES: ${SANDBOX_DOCKER_IMAGE:-miniscira:local}
    volumes:
      - /data/docker.sock:/var/run/docker.sock
    networks:
      - docker-control
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/_ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  db:
    # Pin a digest here for production reproducibility, e.g.
    #   pgvector/pgvector:pg16@sha256:<digest>
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miniscira}
      # :? fails fast with this message when unset in the interpolation env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-miniscira}
    volumes:
      - miniscira-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-miniscira} -d ${POSTGRES_DB:-miniscira}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  sandbox-egress-proxy:
    image: miniscira-sandbox-egress-proxy:local
    restart: unless-stopped
    networks:
      - default
      - sandbox-egress
    healthcheck:
      test: ["CMD", "squidclient", "-h", "127.0.0.1", "-p", "3128", "mgr:info"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      args:
        # Build platform. Defaults to linux/amd64 — the only natively
        # supported arch (see Dockerfile: @firecrawl/pdf-inspector ships no
        # linux-arm64 NAPI binding). Other targets build under emulation;
        # `platform:` below keeps the runtime arch in sync with the build.
        IMAGE_PLATFORM: ${IMAGE_PLATFORM:-linux/amd64}
        # Next inlines the browser's initial model selection at build time.
        # Forward the same .env value used by the runtime so client and server
        # defaults agree after a normal `docker compose build`.
        DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-5.6-sol}
    # Runtime arch — matches the build arg so the container executes on the
    # same platform the image was built for (emulated on ARM hosts).
    platform: ${IMAGE_PLATFORM:-linux/amd64}
    image: ${MINISCIRA_IMAGE:-miniscira:local}
    restart: unless-stopped
    # Real PID 1 (tini): forwards termination to the exec'd process and reaps
    # zombies. The Phase-2 entrypoint supervises both halves (wait-for-either,
    # kill-survivor, exit-code propagation, signal forwarding). The healthcheck
    # below probes BOTH processes so a dead eve still fails readiness.
    init: true
    depends_on:
      db:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
      sandbox-egress-proxy:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file: .env
    environment:
      # env_file values are overridden by this section.
      NODE_ENV: production
      # Pinned from the SAME interpolation source as the mount target below,
      # so the in-container value and the volume target can never diverge.
      LOCAL_STORAGE_DIR: ${LOCAL_STORAGE_DIR:-/data/uploads}
      DOCKER_HOST: tcp://docker-socket-proxy:80
      EVE_DOCKER_PATH: /usr/local/bin/docker-wrapper
      EVE_REAL_DOCKER_PATH: /usr/local/bin/docker-real
      SANDBOX_DOCKER_NETWORK: miniscira_sandbox-egress
      SANDBOX_EGRESS_PROXY_URL: ${SANDBOX_EGRESS_PROXY_URL:-http://sandbox-egress-proxy:3128}
      # Default to this exact deployment image. A separately pinned compatible
      # sandbox image may be selected without changing the app image.
      SANDBOX_DOCKER_IMAGE: ${SANDBOX_DOCKER_IMAGE:-miniscira:local}
    volumes:
      # Uploads + generated artifacts land in LOCAL_STORAGE_DIR (default in
      # .env.example); this named volume keeps them durable across recreates.
      - miniscira-uploads:${LOCAL_STORAGE_DIR:-/data/uploads}
    networks:
      - default
      - docker-control
    healthcheck:
      # Readiness = BOTH halves answer: the app's /api/health (Next up AND
      # database responds, SELECT 1) and eve's /eve/v1/health (agent runtime
      # ready). A healthy container therefore means chat actually works.
      # Uses node, which is present in the image.
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://localhost:3000/api/health'),fetch('http://localhost:3000/eve/v1/health')]).then(rs=>process.exit(rs.every(r=>r.ok)?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Cold starts are slow (Next boot + eve start; eve itself allows up to
      # 60s to reach production health). Don't mark unhealthy during that.
      start_period: 60s

  # One-shot migration service (Phase 2 target path). Applies the COMMITTED
  # migrations in lib/db/migrations to the database and exits. Fresh installs
  # get the full schema; databases adopted from the pre-migration era are
  # stamped as baseline (see scripts/migrate.mjs). Runs ONLY when requested —
  # the profile keeps it out of `docker compose up`:
  #   docker compose --profile migrate run --rm migrate
  # Normal app startup never mutates the schema (the RUN_DB_PUSH gate below is
  # the transitional alternative for adopted stacks).
  migrate:
    image: ${MINISCIRA_IMAGE:-miniscira:local}
    profiles: ["migrate"]
    restart: "no"
    env_file: .env
    environment:
      # Interpolated from the SAME source as POSTGRES_PASSWORD so the URL and
      # the db service can never disagree; env_file alone would suffice, this
      # is belt-and-braces for the bundled-Postgres layout.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/migrate.mjs"]

volumes:
  miniscira-db:
  miniscira-uploads:

networks:
  docker-control:
    internal: true
  sandbox-egress:
    internal: true
