# MiniScira — external / managed Postgres override (no bundled database).
#
#   docker compose -f docker-compose.yml -f docker-compose.external-db.yml up -d --build
#
# Merged on top of docker-compose.yml (Compose v2.20+): removes the bundled
# `db` service and its dependency, and requires DATABASE_URL to point at your
# external Postgres. The target database MUST support pgvector (Neon,
# Supabase, RDS, vanilla Postgres + the vector extension, …).
#
# POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB are then unused — only
# DATABASE_URL matters.
#
# NOTE: `db: null` below is the Compose v2.20+ override-merge way to REMOVE
# a service from the base file (compose-go merge semantics). If your compose
# version rejects it, fall back to editing docker-compose.yml directly:
# delete the whole `db:` service block and the app's `depends_on:` block.
services:
  app:
    depends_on: []
    environment:
      # `:?` fails fast with this message when unset in the interpolation env.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must point at your external Postgres}
  # `null` removes the bundled db service from the merged model.
  db: null
