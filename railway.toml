# MiniScira on Railway — app service config.
#
# The app builds from the root Dockerfile and listens on PORT (Railway injects
# it; the entrypoint defaults to 3000 locally). DATABASE_URL must reference
# the Postgres service over the private network. See docs/RAILWAY_TEMPLATE.md
# for the full two-service project layout and every variable.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
